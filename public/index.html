function addMissingThanas(district, names) {
  if (!thanas[district]) {
    thanas[district] = [];
  }

  const existing = new Set(thanas[district]);

  thanas[district].push(
    ...names.filter(name => !existing.has(name))
  );
}

var bnMap = {
  "ক":"k","খ":"kh","গ":"g","ঘ":"gh","ঙ":"ng","চ":"ch","ছ":"ch","জ":"j","ঝ":"jh","ঞ":"n",
  "ট":"t","ঠ":"th","ড":"d","ঢ":"dh","ণ":"n","ত":"t","থ":"th","দ":"d","ধ":"dh","ন":"n",
  "প":"p","ফ":"f","ব":"b","ভ":"bh","ম":"m","য":"y","র":"r","ল":"l","শ":"sh","ষ":"sh",
  "স":"s","হ":"h","ড়":"r","ঢ়":"rh","য়":"y","ৎ":"t","ং":"ng","ঃ":"h"
};

function collapse(s) {
  return s.replace(/(.)\1+/g, "$1");
}

// বাংলা নাম -> ব্যঞ্জনের ছাঁচ (যেমন "ধানমন্ডি" -> "dhnmnd")
function bnSkel(s) {
  s = s.normalize("NFC").replace(/ড়/g, "ড়").replace(/ঢ়/g, "ঢ়").replace(/য়/g, "য়");
  var out = "";
  for (var i = 0; i < s.length; i++) {
    if (bnMap[s[i]]) out += bnMap[s[i]];
  }
  return collapse(out);
}

// ইংরেজি লেখা -> একই ধরনের ছাঁচ (যেমন "dhanmondi" -> "dhnmnd")
function enSkel(s) {
  s = s.toLowerCase()
    .replace(/ph/g, "f").replace(/z/g, "j").replace(/v/g, "b")
    .replace(/w/g, "b").replace(/q/g, "k").replace(/c(?!h)/g, "k")
    .replace(/[^a-z]/g, "")
    .replace(/[aeiou]/g, "");
  return collapse(s);
}

var areas = [];
for (var k = 0; k < bnNames.length; k++) {
  var tn = thanas[bnNames[k]] || [];
  var tl = [];
  for (var t = 0; t < tn.length; t++) tl.push({ name: tn[t], skel: bnSkel(tn[t]), rating: 0, count: 0 });
  areas.push({ name: bnNames[k], en: enNames[k], rating: 0, count: 0, thanas: tl, open: false });
}

  if (lang === "en") return a.en;
  if (lang === "both") return a.name + " / " + a.en;
  return a.name;
}

  lang = l;

function line(o) {
  return o.count === 0 ? "এখনো কেউ রেটিং দেয়নি"
    : "রেটিং: " + o.rating.toFixed(1) + " / 5 (" + o.count + " জন)";
}

function detail(i) {
  var a = areas[i];
  var html = '<button class="ghost" style="margin-left:0" onclick="closeDetail()">' + txt("close") + '</button>' +
    '<div class="card"><h2>' + dname(a) + '</h2>' +
    '<div class="small">' + line(a) + '</div>' +
    '<button onclick="rate(' + i + ',-1)">রেটিং দিন</button>';
  if (a.thanas.length > 0) {
    html += '<button class="ghost" onclick="toggle(' + i + ')">' +
      (a.open ? "থানা লুকান" : "থানা দেখুন (" + a.thanas.length + ")") + '</button>';
  }
  if (a.open) {
    for (var j = 0; j < a.thanas.length; j++) {
      var th = a.thanas[j];
      html += '<div class="thana"><strong>' + th.name + '</strong>' +
        '<div class="small">' + line(th) + '</div>' +
        '<button onclick="rate(' + i + ',' + j + ')">রেটিং দিন</button></div>';
    }
  }
  html += '<button class="ghost" onclick="showRent()">ভাড়ার তথ্য দিন</button>';
  return html + '</div>';
}

function show() {
  var text = searchBox.value.trim().toLowerCase();
  var html = "";

  if (selected !== -1 && text === "")
   {
    html = detail(selected);
  }
   else if (text !== "") 
   {
    var found = "";

    for (var i = 0; i < areas.length; i++) 
    {
      var a = areas[i];

      if
       (
        a.name.toLowerCase().includes(text) ||
        a.en.toLowerCase().includes(text)
      ) 
      {
        found += '<div class="item" onclick="pick(' + i + ')">' +
          dname(a) + ' (জেলা)</div>';
      }

      for (var j = 0; j < a.thanas.length; j++) {
        var th = a.thanas[j];

       var qs = enSkel(text);
if (th.name.toLowerCase().includes(text) || (qs.length >= 2 && th.skel.includes(qs))) 
 {
          found += '<div class="item" onclick="pickThana(' +
            i + ',' + j + ')">' +
            th.name + '<br><small>জেলা: ' +
            dname(a) + '</small></div>';
        }
      }
    }



    html = found === ""

      ? "<p>" + txt("none") + "</p>"

      : '<div class="sugg">' + found + '</div>';
  }

  listBox.innerHTML = html;
}

  show();

function pick(i) {
  searchBox.value = "";

  show();
}

function closeDetail() {
  selected = -1;
  show();
  searchBox.focus();
}





function toggle(i) {
  areas[i].open = !areas[i].open;
  show();
}

function showRent() {
  if (selected === -1) return;
  fillThanaSelect(selected);
  document.getElementById("rentBox").style.display = "block";
}


function rate(i, j) {
  var area = areas[i];
  var target = j < 0 ? area : area.thanas[j];
  var input = prompt(target.name + " এর জন্য ১ থেকে ৫ এর মধ্যে রেটিং দিন:");
  if (input === null) return;
  var n = Number(input);
  if (!Number.isInteger(n) || n < 1 || n > 5) {
    alert("১ থেকে ৫ এর মধ্যে একটা পূর্ণসংখ্যা দিন।");
    return;
  }
  fetch("/api/rate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: userId, district: area.name, thana: j < 0 ? "" : target.name, score: n })
  })
    .then(function (r) { if (!r.ok) throw new Error(); return loadRatings(); })
    .catch(function () { alert("রেটিং সেভ হয়নি, আবার চেষ্টা করুন।"); });
}
function submitRent() {
  var amount = Number(document.getElementById("rentAmount").value);
  if (!Number.isInteger(amount) || amount < 1000 || amount > 500000) {
    alert("ভাড়া ১,০০০ থেকে ৫,০০,০০০ টাকার মধ্যে দিন।");
    return;
  }
  var area = currentArea();
  if (!area) return;
  fetch("/api/rent", {

    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      userId: userId,

      district: area.district,

      thana: area.thana,
      flatType: document.getElementById("flatType").value,


      rent: amount
    })
  })
    .then(function (r) {

      if (!r.ok) throw new Error();
      alert("ধন্যবাদ, তথ্যটি জমা হয়েছে।");


      document.getElementById("rentAmount").value = "";
    })
    .catch(function () { alert("জমা হয়নি, আবার চেষ্টা করুন।"); });
}


function currentArea() {
  // ব্যবহারকারী যে জেলা/থানা খুলে রেখেছেন তা বের করা
  if (selected === -1) { alert("আগে একটা জেলা খুলুন।"); return null; }
  var a = areas[selected];
  return { district: a.name, thana: "" };
}
function loadRatings() {
  return fetch("/api/ratings")
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      areas.forEach(function (a) {


        a.rating = 0; a.count = 0;
        a.thanas.forEach(function (t) { t.rating = 0; t.count = 0; });
      });
      rows.forEach(function (row) {
        var a = areas.find(function (x) { return x.name === row.district; });
        if (!a) return;
       var target = row.thana === "" ? a
          : a.thanas.find(function (t) { return t.name === row.thana; });
        if (target) { target.rating = row.rating; target.count = row.count; }
      });
      show();
    });
}

searchBox.addEventListener("input", function () { selected = -1; show(); });
setLang("bn");
function fillThanaSelect(i) {
  var sel = document.getElementById("thanaSelect");
  sel.innerHTML = "";
  var a = areas[i];

  var opt = document.createElement("option");
  opt.value = "";
  opt.textContent = "জেলা সাধারণ (থানা নির্বাচন না করে)";
  sel.appendChild(opt);
  for (var j = 0; j < a.thanas.length; j++) {

    var o = document.createElement("option");
    o.value = a.thanas[j].name;
    o.textContent = a.thanas[j].name;
    sel.appendChild(o);
  }
}
loadRatings();
</script>
